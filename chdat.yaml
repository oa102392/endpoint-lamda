apiVersion: apps/v1
kind: Deployment
metadata:
  name: chromadb
  namespace: api   # <-- change if needed
  labels:
    app: chromadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      imagePullSecrets:
        - name: gitea
      containers:
        - name: chromadb
          image: gitea.core-services.e3.aero.org/intdoc/chromadb-intellidoc:0.1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          # If you want to force persistence path explicitly:
          env:
            - name: CHROMA_PERSIST_DIRECTORY
              value: /data
          # Health checks (optional but recommended)
          readinessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: api   # <-- same namespace
spec:
  selector:
    app: chromadb
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
